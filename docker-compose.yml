services:
  postgres:
    image: postgres:16-alpine
    container_name: kfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kfs
      POSTGRES_PASSWORD: kfs_dev_password
      POSTGRES_DB: kfs
    ports:
      - "5435:5432"
    volumes:
      - kfs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfs -d kfs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kfs_postgres_data:
